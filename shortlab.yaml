apiVersion: v1
kind: Pod
metadata:
  labels:
    app: shortlab
  name: shortlab
spec:
  containers:
    - image: localhost/shortener:latest
      name: app
      ports:
        - containerPort: 8080
          hostPort: 8080
      # Health probes hit /healthz, which verifies Redis reachability.
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
    - image: docker.io/library/redis:8-alpine
      name: redis
      volumeMounts:
        - mountPath: /data
          name: redis-data
  volumes:
    - name: redis-data
      persistentVolumeClaim:
        claimName: shortlab-redis-data
