name: build-push
on:
  push:
    branches: [live]
    paths:
      ["main.go", "main_test.go", "go.mod", "go.sum", "container.dockerfile"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container.dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shortener:latest
            ghcr.io/${{ github.repository_owner }}/shortener:${{ github.sha }}
