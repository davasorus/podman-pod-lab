name: build-push
on:
  push:
    branches: [live]
    paths: ["main.go", "go.mod", "go.sum", "container.dockerfile"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container.dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/shortener:latest
